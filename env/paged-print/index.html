<!-- 源文：分页的唯一数据源。每次重排都从这里重新克隆。 -->
<template id="src">
  <h1>从活字到像素：版面编排简史</h1>

  <p>版面编排的历史，几乎就是信息传播效率的历史。早在雕版印刷成熟之前，抄书人就已经懂得用固定的行距、栏宽与留白来降低阅读的疲劳。北宋庆历年间，毕昇发明泥活字，单个字模可以反复排版使用，版面第一次具备了“可重组”的属性<sup class="fn-ref" data-fn="bixin"></sup>。这一思想——把内容拆成可复用的最小单元再组装成页——与今天网页排版中“组件化”的思路遥相呼应。</p>

  <p>活字的意义不在于单个字模，而在于它确立了一条原则：版面是动态计算的结果，而不是一次雕刻的成品。当内容增删时，字模重新归位，行与页随之重排。本文后面会看到，这条原则在数字时代被浏览器继承了下来，只是“字模”换成了盒模型，“捡字工人”换成了排版引擎。</p>

  <h2>金属活字与机械排版</h2>

  <p>十五世纪中叶，古登堡在美因茨将金属活字、油性油墨与螺旋压印机组合成一套完整的生产系统，书籍的成本由此大幅下降<sup class="fn-ref" data-fn="gutenberg"></sup>。值得注意的是，古登堡圣经的版面刻意模仿手抄本：两栏排列、密集的连字、几乎看不见的行距变化。新技术诞生之初，往往先模仿旧媒介的形态，再慢慢长出自己的语言。</p>

  <p>十九世纪的莱诺铸排机把“捡字”变成了键盘操作：操作员敲下按键，铜模自动成行，熔融的铅合金一次浇铸出整行字条。行，第一次成为排版的最小物理单位。这也是为什么直到今天，行高（line-height）依然是数字排版中最基础的度量之一。</p>

  <blockquote>
    <p>“书页是一扇窗，排印工人的职责是让玻璃消失。”—— 二十世纪书籍设计界广为流传的一句话，常被归于排版师扬·奇肖尔德的倡导。</p>
  </blockquote>

  <h2>铅空、网格与版面秩序</h2>

  <p>金属活字时代，空白不是“没有印东西”，而是实实在在的金属块：铅空、铅条、空铅被精确地填入字与字、行与行、栏与栏之间。排版的秩序感，很大程度上来自这些看不见的负空间被严格量化。二十世纪中叶，瑞士国际主义平面设计把这种做法系统化，提出了影响深远的网格系统<sup class="fn-ref" data-fn="grid"></sup>：先划分栏目与基线网格，再让标题、正文、图片各就各位。</p>

  <p>网格系统给后世最重要的遗产包括：</p>

  <ul>
    <li>栏与栏距的标准化，使页面可以像积木一样组合；</li>
    <li>基线网格让跨栏的文字行彼此对齐，视觉上更稳定；</li>
    <li>“先结构、后装饰”的流程，成为现代版式软件的骨架。</li>
  </ul>

  <p>中文字体的演变也与印刷工艺互相塑造。宋体字的横细竖粗，部分源于雕版刀法与木纹方向的妥协；而它醒目、端正的气质，又反过来成为后世书刊正文字体的基准<sup class="fn-ref" data-fn="songti"></sup>。字体从来不只是审美问题，也是工艺条件的沉淀。</p>

  <h2>数字时代的分页难题</h2>

  <p>屏幕上的内容是连续滚动的，而打印输出是分页的，这两种模型之间存在天然的张力。网页排版引擎擅长“流式布局”：内容像水一样自上而下填满任意宽度的容器；而打印排版要求把这条水流切成一张张固定尺寸的纸，并且满足一系列约束——标题不能孤悬页底、脚注要跟随引用、页码要连续且对准正确的文字。</p>

  <p>标准化组织为此制定了分页媒体的样式规范，定义了页面盒模型、页边距区域以及脚注浮动等概念<sup class="fn-ref" data-fn="csspm"></sup>。不过，主流浏览器对其中高级特性的支持至今参差不齐，尤其是“脚注出现在引用页底部”这一条，多数引擎尚未实现。因此在实践中，需要精确分页的应用往往会用脚本自行测量与切分：先在与页面等宽的隐藏容器里排版，再按行高逐行装箱，把每一页的内容、脚注与页码分别落位。</p>

  <p>这种“测量—装箱—渲染”的思路，本质上是在浏览器里复刻当年捡字工人的工作：只不过工人眼里的字盘，变成了文档对象模型；手里的镊子，变成了矩形测量接口。内容变化时整盘重排，页码自然始终对准同一段文字——这正是本页演示的分页引擎所采用的方法。</p>

  <p>从泥活字到铅字条，再到屏幕上的行盒，排版的最小单位不断抽象，但目标始终未变：让读者忘记版面的存在，只专注于文字本身。下一次当你打印一份长文，看到页脚的页码与页底的脚注各就各位时，或许可以想起这背后绵延了近千年的装箱艺术。</p>

  <section class="fn-defs">
    <ol>
      <li data-fn="bixin">据沈括《梦溪笔谈》卷十八记载，毕昇以胶泥刻字，火烧令坚，设铁范布字，可“瞬息可就”。</li>
      <li data-fn="gutenberg">古登堡印刷系统约于 1450 年前后成型，其代表作四十二行圣经约印制 180 部。</li>
      <li data-fn="grid">网格系统的经典论述见约瑟夫·米勒-布罗克曼《平面设计中的网格系统》，1981 年。</li>
      <li data-fn="songti">宋体在明代中后期随雕版印刷的商品化而成熟，在日本被称为“明朝体”。</li>
      <li data-fn="csspm">参见 W3C 规范《CSS Paged Media Module Level 3》与《CSS Generated Content for Paged Media》。</li>
    </ol>
  </section>
</template>
